[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "research-rag"
version = "0.2.0"
description = "Fully offline RAG over research papers: Docling parsing, section-aware retrieval over Weaviate, and local LLM summarization via Ollama."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Saleem Bouri" }]
keywords = ["rag", "weaviate", "docling", "ollama", "vector-search", "research-papers"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "docling>=2.99,<3",
    "sentence-transformers>=5.2",
    "weaviate-client>=4.20,<5",
    "ollama>=0.6",
    "fastapi>=0.138",
    "uvicorn>=0.49",
    "python-multipart>=0.0.32",
    "pydantic>=2.12",
    "pymupdf>=1.27",
    "python-dotenv>=1.2",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "playwright>=1.40"]

[project.scripts]
research-rag = "research_rag.cli:main"

[tool.setuptools]
packages = ["research_rag"]
